<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit 30 Planner</title>
  <!-- Inline so the page makes no external requests at all. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1b1b'/%3E%3Crect x='3' y='3' width='10' height='10' rx='3' fill='none' stroke='%23f2f2f2' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>Circuit 30 Planner</h1>
    <nav>
      <button type="button" id="btn-open">Open…</button>
      <button type="button" id="btn-save">Save</button>
      <button type="button" id="btn-presets">Presets…</button>
      <button type="button" id="btn-room">Room…</button>
    </nav>
    <input type="file" id="open-input" accept=".html,text/html" hidden>
  </header>

  <aside id="palette" aria-label="Track pieces">
    <h2>Pieces</h2>
    <ul id="palette-list"></ul>
    <button type="button" id="btn-inventory">Edit inventory…</button>
  </aside>

  <main>
    <svg id="canvas" role="application" aria-label="Track layout" tabindex="0"></svg>
    <p id="status" role="status"></p>
  </main>

  <aside id="bom" aria-label="Bill of materials">
    <h2>Materials</h2>
    <p id="bom-warning" role="alert"></p>
    <table id="bom-table">
      <thead><tr><th scope="col">Part</th><th scope="col">Owned</th><th scope="col">Used</th></tr></thead>
      <tbody></tbody>
    </table>
    <dl id="metrics">
      <dt>Size</dt><dd><output id="out-size">—</output></dd>
      <dt>Lap</dt><dd><output id="out-lap">—</output></dd>
      <dt>Mats</dt><dd><output id="out-mats">—</output></dd>
    </dl>
    <p id="recommendation"></p>
  </aside>

  <dialog id="inventory-dialog" aria-labelledby="inventory-dialog-title">
    <h2 id="inventory-dialog-title">Edit inventory</h2>
    <form method="dialog" id="inventory-form"></form>
  </dialog>
  <dialog id="room-dialog" aria-labelledby="room-dialog-title">
    <h2 id="room-dialog-title">Room boundary</h2>
    <form method="dialog" id="room-form">
      <p><label>Width (m) <input type="number" name="w" step="0.3" min="0"></label></p>
      <p><label>Depth (m) <input type="number" name="h" step="0.3" min="0"></label></p>
      <menu>
        <button value="clear">No boundary</button>
        <button value="set">Set</button>
      </menu>
    </form>
  </dialog>
  <dialog id="presets-dialog" aria-labelledby="presets-dialog-title">
    <h2 id="presets-dialog-title">Presets</h2>
    <ul id="presets-list"></ul>
    <form method="dialog"><button>Close</button></form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
