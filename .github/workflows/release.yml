name: release

# release-please keeps a "release" pull request open with the next versions
# and changelogs, computed from conventional commits. Nothing is published
# until a person merges that pull request.
#
# Running this workflow by hand with a tag (e.g. track-format-v0.2.0)
# publishes that already-tagged release. This is the recovery path when a
# publish failed after release-please created the release: a re-run would
# skip it, because release-please sees the release already exists.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. track-format-v0.2.0'
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write    # dispatch ci on the release pull request's branch
  id-token: write   # npm trusted publishing and provenance, no stored token

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub starts no workflows for a pull request that release-please's
      # token opens or updates, so the release pull request would never get
      # its required checks. Running ci on its branch by dispatch (which that
      # token may do) reports them on the pull request's head commit.
      # A push that leaves the release pull request as it was gives no pull
      # request here (its last ci run still stands), so the branch is read in
      # the shell, where an empty value skips the dispatch instead of failing.
      - if: steps.rp.outputs.prs_created == 'true'
        run: |
          branch=$(jq -r '.headBranchName // empty' <<< "$PR")
          if [ -z "$branch" ]; then
            echo "The release pull request did not change; no ci to dispatch."
            exit 0
          fi
          gh workflow run ci --repo "$GITHUB_REPOSITORY" --ref "$branch"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
      - if: steps.rp.outputs.releases_created == 'true'
        uses: actions/checkout@v4
      - if: steps.rp.outputs.releases_created == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.rp.outputs.releases_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - if: steps.rp.outputs.releases_created == 'true'
        run: npm install -g npm@latest && pnpm install --frozen-lockfile
      - if: steps.rp.outputs['packages/track-format--release_created'] == 'true'
        working-directory: packages/track-format
        run: npm publish --provenance --access public
      - if: steps.rp.outputs['packages/design--release_created'] == 'true'
        working-directory: packages/design
        run: npm publish --provenance --access public
      - if: steps.rp.outputs['packages/auth--release_created'] == 'true'
        working-directory: packages/auth
        run: npm publish --provenance --access public

  publish-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag arrives through env, never interpolated into the script, and
      # must name a known package exactly.
      - id: pkg
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^(track-format|design|auth)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
          echo "dir=packages/${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest && pnpm install --frozen-lockfile
      - working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
