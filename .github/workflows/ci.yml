name: ci

# Pull requests run the checks but never deploy. A push to main runs the same
# checks and then deploys the planner, accounts and timing, each only if it
# changed since the last successful run on main, so a change whose own run
# failed still ships with the next green one (accounts and timing also only
# once their DEPLOY_ENABLED variable is set). Run the workflow by hand on main
# ("Run workflow") to check and deploy all three.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --affected compares against the base branch, which needs history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm turbo run test lint typecheck --affected
      - if: github.event_name != 'pull_request'
        run: pnpm turbo run test lint typecheck
      # Passkeys in a real browser (apps/accounts/test/browser). GitHub's
      # ubuntu-latest image ships Google Chrome, which is playwright-core's
      # 'chrome' channel, so nothing is downloaded.
      - run: google-chrome --version
      - run: pnpm --filter @tinylap/accounts test:browser
      - run: pnpm --filter @tinylap/timing-app test:browser

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/track-planner/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t planner .
      - run: docker run -d -p 8080:8080 planner
      - run: curl --silent --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8080/ > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/smoke.js http://localhost:8080/
      - run: node apps/track-planner/test/smoke-api.js http://localhost:8080/
      # TINYLAP_DEV=1 makes accounts listen on loopback only, so it shares the
      # runner's network instead of publishing a port. CI-only secrets.
      - run: docker build -f apps/accounts/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t accounts .
      - run: >
          docker run -d --network host
          -e TINYLAP_DEV=1
          -e TINYLAP_ISSUER=http://localhost:4100
          -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdef0123456789
          -e 'TINYLAP_CLIENTS=[{"clientId":"ci","clientSecret":"ci-only","redirectUris":["http://localhost:8080/auth/callback"],"resource":"http://localhost:8080"}]'
          accounts
      - run: curl --silent --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:4100/sign-in > /dev/null
      - run: node apps/accounts/test/smoke.js http://localhost:4100/
      # Timing only has to come up: nothing it points at is reachable.
      - run: docker build -f apps/timing/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t timing .
      - run: >
          docker run -d -p 8082:8080
          -e TINYLAP_ISSUER=http://localhost:4100 -e TINYLAP_CLIENT_ID=ci -e TINYLAP_CLIENT_SECRET=ci-only
          -e TINYLAP_FEED_TOKEN=ci-only -e TINYLAP_TOKEN_KEYS=ci:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          -e TINYLAP_PUBLIC_URL=http://localhost:8082 -e TINYLAP_PLANNER_URL=http://localhost:8080
          timing
      - run: curl --silent --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8082/ > /dev/null
      - run: curl --silent --fail http://localhost:8082/openapi.json > /dev/null

  # The identity story across accounts and the planner in a real browser
  # (tools/e2e). It does not hold up a deploy: deploy needs check and smoke.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest ships Google Chrome, playwright-core's 'chrome' channel.
      - run: google-chrome --version
      - run: pnpm test:e2e

  # The decoder and transponder firmware (firmware/tinylap-decoder and
  # firmware/tinylap-transponder): host tests, then a build of each image.
  # Only when firmware files change on a pull request; a push to main or a run
  # by hand always runs it. Nothing waits on it: deploy needs check and smoke
  # only.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - 'packages/timing/test/zround-vectors.json'
              - '.github/workflows/ci.yml'

  firmware:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      # A shallow clone is enough: the build stamps `git describe --always
      # --dirty` into the image, which falls back to the short commit hash
      # without tags, and CI never ships the binary.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PlatformIO's platforms, toolchains and libraries: the slow part of a
      # cold run. Keyed on both projects' platformio.ini, which pin them.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/*/platformio.ini') }}
      - run: pip install platformio==6.2.0
      # The native env builds with the address and undefined-behaviour
      # sanitizers, which ubuntu-latest's gcc supports.
      - run: pio test -e native
        working-directory: firmware/tinylap-decoder
      - run: pio run -e esp32dev -e capture
        working-directory: firmware/tinylap-decoder
      # The transponder: host tests, the ATtiny45 image, and the flash script's
      # tests (plain Python, no board).
      - run: pio test -e native
        working-directory: firmware/tinylap-transponder
      - run: pio run -e attiny45
        working-directory: firmware/tinylap-transponder
      - run: python3 -m unittest discover -s tools
        working-directory: firmware/tinylap-transponder

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  commit-title:
    # Also on a dispatch to a pull request's branch (the release pull request,
    # see release.yml), never on a run by hand on main, which has no title.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a dispatch, the title of the open pull request for this branch.
      - if: github.event_name == 'workflow_dispatch'
        id: pr
        run: echo "title=$(gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json title --jq .title)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Squash merges make the pull request title the commit message.
      - run: echo "$TITLE" | pnpm commitlint
        env:
          TITLE: ${{ github.event.pull_request.title || steps.pr.outputs.title }}

  deploy:
    needs: [check, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      # Deploys queue instead of cancelling: a newer push could otherwise cancel a deploy whose change it doesn't contain itself, and runs in order still leave the newest image live.
      group: deploy-track-planner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          # Changed since the last successful run on main, not since the previous
          # commit: a push whose run failed never deployed. A run by hand deploys
          # everything. Fail open: with no base, or a range that can't be diffed
          # (first run, force-push), deploy rather than silently skip.
          base=""
          if [ "$EVENT" = push ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          fi
          echo "Deploying what changed since: ${base:-everything}"
          if [ -z "$base" ] || ! files=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null); then
            echo "planner=true" >> "$GITHUB_OUTPUT"
            accounts=true
            timing=true
          else
            grep -qE '^(apps/track-planner|packages|tools)/|^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|\.dockerignore)$' <<< "$files" && echo "planner=true" >> "$GITHUB_OUTPUT"
            grep -qE '^(apps/accounts|packages/auth|packages/design|tools)/|^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|\.dockerignore)$' <<< "$files" && accounts=true
            grep -qE '^(apps/timing|packages|tools)/|^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|\.dockerignore)$' <<< "$files" && timing=true
          fi
          # The Fly app does not exist until the maintainer has followed the
          # checklist in apps/accounts/README.md, whose last step sets this.
          if [ "$accounts" = true ] && [ "$ACCOUNTS_DEPLOY_ENABLED" = true ]; then
            echo "accounts=true" >> "$GITHUB_OUTPUT"
          fi
          # The Fly app does not exist until the maintainer has followed the
          # checklist in apps/timing/README.md, whose last step sets this.
          if [ "$timing" = true ] && [ "$TIMING_DEPLOY_ENABLED" = true ]; then
            echo "timing=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          ACCOUNTS_DEPLOY_ENABLED: ${{ vars.ACCOUNTS_DEPLOY_ENABLED }}
          TIMING_DEPLOY_ENABLED: ${{ vars.TIMING_DEPLOY_ENABLED }}
      - if: steps.changed.outputs.planner == 'true' || steps.changed.outputs.accounts == 'true' || steps.changed.outputs.timing == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      # Build context is the repo root (the image needs packages and tools);
      # the positional "." makes that explicit rather than relying on
      # flyctl's default of the config file's folder.
      - if: steps.changed.outputs.planner == 'true'
        run: >
          flyctl deploy . --remote-only
          --config apps/track-planner/fly.toml
          --dockerfile apps/track-planner/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: steps.changed.outputs.accounts == 'true'
        run: >
          flyctl deploy . --remote-only
          --config apps/accounts/fly.toml
          --dockerfile apps/accounts/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: steps.changed.outputs.timing == 'true'
        run: >
          flyctl deploy . --remote-only
          --config apps/timing/fly.toml
          --dockerfile apps/timing/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
