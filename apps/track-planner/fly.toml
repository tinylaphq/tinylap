# Single Node app, one region, scales to zero.
app = 'circuit30-planner'
primary_region = 'fra'

[build]

[env]
  TINYLAP_PUBLIC_URL = 'https://circuit30-planner.fly.dev'
  TINYLAP_CLIENT_IP_HEADER = 'Fly-Client-IP'
  # Log-in through accounts. Uncomment both once the planner's login secrets
  # exist (apps/accounts/README.md, first deploy): with TINYLAP_ISSUER set the
  # planner refuses to start without them.
  # TINYLAP_ISSUER = 'https://tinylap-accounts.fly.dev'
  # TINYLAP_CLIENT_ID = 'track-planner'

# SQLite on one volume means exactly one machine. Fly snapshots the volume
# daily; that is the backup. Create it once:
#   fly volumes create tinylap_data --app circuit30-planner --region fra --size 1
[mounts]
  source = 'tinylap_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Nobody is browsing this at 3am. The machine stops when idle and wakes
  # on the next request, which costs a second or two of cold start and
  # avoids paying for a VM that is doing nothing.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # The smallest thing Fly offers. It is one Node process serving a small
  # app and a SQLite file; anything larger would be paying for idle memory.
  size = 'shared-cpu-1x'
  memory = '256mb'
