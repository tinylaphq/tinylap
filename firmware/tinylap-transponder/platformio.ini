; TL_LED_PIN and upload_protocol are the two settings that depend on the board and the programmer (spec §4.1).
; The extended fuse is not set (spec §4.2); lock_bits = 0xFF keeps `-t fuses` from sending an empty lock write.
[env:attiny45]
platform = atmelavr@5.3.0
board = attiny45
board_build.f_cpu = 8000000L
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD5
board_fuses.lock_bits = 0xFF
upload_protocol = usbasp
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DTL_LED_PIN=PB0
lib_extra_dirs = ../lib

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -fsanitize=address,undefined
lib_extra_dirs = ../lib
