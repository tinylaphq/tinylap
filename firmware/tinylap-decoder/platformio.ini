[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 19200
; FW_VERSION: the build's git describe, for the %TLLOG boot line (spec §6.1); "unknown" outside git
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++17
  !echo "-DFW_VERSION=\\\"$(git describe --always --dirty 2>/dev/null || echo unknown)\\\""
build_unflags = -std=gnu++11
build_src_filter = +<*> -<capture.cpp>

[env:capture]
extends = env:esp32dev
monitor_speed = 921600
build_src_filter = +<capture.cpp> +<ir_rmt.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -fsanitize=address,undefined '-DVECTORS_PATH="${PROJECT_DIR}/../../packages/timing/test/zround-vectors.json"'
lib_deps = bblanchon/ArduinoJson@7.4.3
